<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pens.Ink — MLK Jr. Quote</title>
  <style>
    @font-face {
      font-family: "Simone Kimber";
      src: url("Simone Kimber.otf") format("opentype");
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: url('Vintage Paper 21.jpg') center center no-repeat;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Simone Kimber", cursive;
      font-size: 2.2em;
      color: #1a1a1a;
    }

    .quote-container {
      max-width: 80%;
      text-align: center;
      opacity: 0;
      transition: opacity 2.5s ease-in-out;
    }

    .quote-container.visible {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="quote-container" id="quote">
    “Injustice anywhere is a threat to justice everywhere.”<br>— Martin Luther King Jr.
  </div>

  <script>
    const quote = document.getElementById('quote');

    function fadeLoop() {
      quote.classList.add('visible');
      setTimeout(() => {
        quote.classList.remove('visible');
      }, 5000); // show for 5 seconds
      setTimeout(fadeLoop, 8000); // total loop every 8 seconds
    }

    setTimeout(fadeLoop, 1000); // start after slight delay
  </script>
</body>
</html>
