<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pens.Ink</title>
  <style>
    @font-face {
      font-family: 'Wantsignature';
      src: url('Wantsignature.otf') format('opentype');
    }

    body {
      margin: 0;
      padding: 0;
      background-image: url('paper.jpg');
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .quote {
      font-family: 'Wantsignature', cursive;
      font-size: 36px;
      color: #2e2e2e;
      text-align: center;
      max-width: 90vw;
      padding: 20px;
      position: absolute;
      opacity: 1;
      transition: opacity 6s ease-in-out;
      white-space: pre-wrap;
    }

    .quote.fade-out {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="quote" id="quote"></div>

  <script>
    const quoteText = "\"Injustice anywhere is a threat to justice everywhere.\"\n— Martin Luther King Jr.";
    const quoteEl = document.getElementById('quote');

    function setRandomPosition() {
      const padding = 60;
      const maxLeft = window.innerWidth - quoteEl.offsetWidth - padding;
      const maxTop = window.innerHeight - quoteEl.offsetHeight - padding;
      const left = Math.floor(Math.random() * maxLeft);
      const top = Math.floor(Math.random() * maxTop);
      quoteEl.style.left = `${left}px`;
      quoteEl.style.top = `${top}px`;
    }

    function showQuote() {
      quoteEl.textContent = quoteText;
      setRandomPosition();
      quoteEl.classList.remove('fade-out');

      setTimeout(() => {
        quoteEl.classList.add('fade-out');
      }, 9000); // Show for 9 seconds

      setTimeout(() => {
        showQuote();
      }, 15000); // Full cycle before repeating
    }

    setTimeout(showQuote, 5000); // Delay 5 seconds before first show
  </script>
</body>
</html>
