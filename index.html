<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pens.Ink</title>
  <style>
    @font-face { font-family: 'RoyalWedding'; src: url('RoyalWedding-Regular.otf'); }
    @font-face { font-family: 'Simone Kimber'; src: url('Simone Kimber.otf'); }
    @font-face { font-family: 'Granady'; src: url('Granady1.otf'); }
    @font-face { font-family: 'Alekin Wiliam'; src: url('Alekin Wiliam.otf'); }

    body {
      margin: 0;
      padding: 0;
      background-image: url('paper.jpg');
      background-size: cover;
      background-position: center;
      font-family: 'RoyalWedding', serif;
      overflow: hidden;
    }

    header {
      width: 100%;
      text-align: center;
      padding: 25px;
      font-size: 40px;
      background-color: rgba(255, 255, 255, 0.6);
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      letter-spacing: 2px;
    }

    .quote {
      font-size: 48px;
      color: #111;
      text-align: center;
      position: absolute;
      max-width: 90vw;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      white-space: pre-wrap;
      animation: none;
    }

    .quote.show {
      animation: fadeIn 4s ease forwards, fadeOut 4s ease 19s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .shop-link {
      position: absolute;
      bottom: 25px;
      right: 30px;
      font-size: 24px;
      font-family: 'Granady', cursive;
      background-color: rgba(255,255,255,0.4);
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      color: #333;
      box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    .shop-link:hover {
      background-color: rgba(255,255,255,0.8);
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="quote" id="quote"></div>
  <a href="shop.html" class="shop-link">Visit the Shop</a>
