<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pens.Ink</title>
  <style>
    @font-face { font-family: 'Alekin Wiliam'; src: url('Alekin Wiliam.otf'); }
    @font-face { font-family: 'Simone Kimber'; src: url('Simone Kimber.otf'); }
    @font-face { font-family: 'The French Letters'; src: url('TheFrenchLetters.otf'); }
    @font-face { font-family: 'Granady'; src: url('Granady1.otf'); }

    body {
      margin: 0;
      padding: 0;
      background-image: url('paper.jpg');
      background-size: cover;
      background-position: center;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quote {
      position: absolute;
      font-size: 48px;
      color: #1a1a1a;
      max-width: 80vw;
      text-align: center;
      white-space: pre-wrap;
      opacity: 1;
      transition: opacity 3s ease-in-out;
    }

    .fade-out {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="quote" id="quote"></div>

  <script>
    const quotes = [
      "\"Injustice anywhere is a threat to justice everywhere.\"\n— Martin Luther King Jr.",
      "\"The pen is mightier than the sword.\"\n— Edward Bulwer-Lytton",
      "\"You can make anything by writing.\"\n— C.S. Lewis",
      "\"Writing is the painting of the voice.\"\n— Voltaire",
      "\"The pen compels lucidity.\"\n— Alain de Botton",
      "\"Fill your paper with the breathings of your heart.\"\n— William Wordsworth"
    ];

    const fonts = ['Alekin Wiliam', 'Simone Kimber', 'The French Letters', 'Granady'];

    const quoteEl = document.getElementById('quote');

    let usedIndexes = [];
    let currentTimeouts = [];

    function setRandomPosition() {
      const padding = 40;
      const maxLeft = window.innerWidth - quoteEl.offsetWidth - padding;
      const maxTop = window.innerHeight - quoteEl.offsetHeight - padding;
      const left = Math.floor(Math.random() * maxLeft);
      const top = Math.floor(Math.random() * maxTop);
      quoteEl.style.left = `${left}px`;
      quoteEl.style.top = `${top}px`;
    }

    function typeText(text, index = 0) {
      if (index === 0) quoteEl.textContent = "";

      if (index < text.length) {
        quoteEl.textContent += text[index];
        const timeout = setTimeout(() => typeText(text, index + 1), 50);
        currentTimeouts.push(timeout);
      } else {
        // hold before fading out
        const holdTimeout = setTimeout(() => {
          quoteEl.classList.add("fade-out");
          const nextTimeout = setTimeout(showQuote, 3000);
          currentTimeouts.push(nextTimeout);
        }, 3000);
        currentTimeouts.push(holdTimeout);
      }
    }

    function showQuote() {
      // Clear previous timeouts
      currentTimeouts.forEach(clearTimeout);
      currentTimeouts = [];

      quoteEl.classList.remove("fade-out");

      if (usedIndexes.length === quotes.length) usedIndexes = [];
      let index;
      do {
        index = Math.floor(Math.random() * quotes.length);
      } while (usedIndexes.includes(index));
      usedIndexes.push(index);

      const quote = quotes[index];
      const font = fonts[Math.floor(Math.random() * fonts.length)];

      quoteEl.style.fontFamily = font;
      quoteEl.style.fontSize = font === 'The French Letters' ? '48px' : '42px';
      setRandomPosition();
      typeText(quote);
    }

    setTimeout(showQuote, 7000);
  </script>
</body>
</html>
